services:
  - type: web
    name: buildflow-erp
    runtime: node
    rootDirectory: buildflow-erp
    plan: free
    buildCommand: cd server && npm ci && npx prisma generate && npm run build && cd ../client && npm ci && npm run build
    startCommand: cd server && npx prisma migrate deploy && npx prisma db seed && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: buildflow-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
databases:
  - name: buildflow-erp-db
    plan: free
    databaseName: buildflow_erp
    user: buildflow
